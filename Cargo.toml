[workspace]
members = [
    "crates/tesela-core",
    "crates/tesela-ir",
    "crates/tesela-store",
    "crates/tesela-runtime",
    "crates/tesela-macros",
    "crates/tesela",
    "sdk/python",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Miguel Cárdenas"]
repository = "https://github.com/miguelcsx/tesela"
keywords = ["ontology", "runtime", "data-platform", "sdk"]
categories = ["data-structures"]
readme = "README.md"

[workspace.dependencies]
tesela-core = { path = "crates/tesela-core", version = "0.1.0" }
tesela-ir = { path = "crates/tesela-ir", version = "0.1.0" }
tesela-store = { path = "crates/tesela-store", version = "0.1.0" }
tesela-runtime = { path = "crates/tesela-runtime", version = "0.1.0" }
tesela-macros = { path = "crates/tesela-macros", version = "0.1.0" }
tesela = { path = "crates/tesela", version = "0.1.0" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
tokio = { version = "1", features = ["full"] }
schemars = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pyo3 = "0.26"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
