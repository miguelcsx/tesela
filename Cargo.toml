[workspace]
members = [
    "crates/tesela-core",
    "crates/tesela-ir",
    "crates/tesela-graph",
    "crates/tesela-compiler",
    "crates/tesela-runtime",
    "crates/tesela-memory",
    "crates/tesela-server",
    "crates/tesela-graphql",
    "crates/tesela-mcp",
    "crates/tesela-sdk",
    "crates/tesela-macros",
    "crates/tesela-cabi",
    "crates/tesela-vector",
    "crates/tesela-telemetry",
    "crates/tesela-ids",
    "crates/tesela",
    "adapters/tesela-adapter-postgres",
    "adapters/tesela-adapter-apxm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Miguel Cárdenas"]
repository = "https://github.com/miguelcsx/tesela"
keywords = ["ontology", "runtime", "data-platform", "sdk"]
categories = ["data-structures", "web-programming"]
readme = "README.md"

[workspace.dependencies]
tesela-core = { path = "crates/tesela-core", version = "0.1.0" }
tesela-ir = { path = "crates/tesela-ir", version = "0.1.0" }
tesela-graph = { path = "crates/tesela-graph", version = "0.1.0" }
tesela-compiler = { path = "crates/tesela-compiler", version = "0.1.0" }
tesela-runtime = { path = "crates/tesela-runtime", version = "0.1.0" }
tesela-memory = { path = "crates/tesela-memory", version = "0.1.0" }
tesela-server = { path = "crates/tesela-server", version = "0.1.0" }
tesela-graphql = { path = "crates/tesela-graphql", version = "0.1.0" }
tesela-mcp = { path = "crates/tesela-mcp", version = "0.1.0" }
tesela-sdk = { path = "crates/tesela-sdk", version = "0.1.0" }
tesela-macros = { path = "crates/tesela-macros", version = "0.1.0" }
tesela-cabi = { path = "crates/tesela-cabi", version = "0.1.0" }
tesela-vector = { path = "crates/tesela-vector", version = "0.1.0" }
tesela-telemetry = { path = "crates/tesela-telemetry", version = "0.1.0" }
tesela-ids = { path = "crates/tesela-ids", version = "0.1.0" }
tesela-adapter-postgres = { path = "adapters/tesela-adapter-postgres", version = "0.1.0" }
tesela-adapter-apxm = { path = "adapters/tesela-adapter-apxm", version = "0.1.0" }

sqlx-postgres = { version = "0.8", default-features = false, features = ["json", "chrono", "uuid"] }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
petgraph = "0.8"
slotmap = "1"
smallvec = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "timeout"] }
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
async-graphql = "7"
async-graphql-axum = "7"
jsonschema = "0.30"
tokio-stream = "0.1"
futures-util = "0.3"
jsonrpc-core = "22"
schemars = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aes-gcm = "0.10"
base64 = "0.22"
ulid = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
