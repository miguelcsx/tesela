name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build C ABI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -tags cabi -buildmode=c-shared -ldflags "-s -w" -o dist/liblattice-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.dll' || (matrix.goos == 'darwin' && '.dylib' || '.so') }} ./pkg/lattice/cabi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liblattice-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/liblattice-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: liblattice-*
          merge-multiple: true
      - name: Generate SHA-256 manifest
        run: |
          cd dist
          sha256sum liblattice-* > manifest.sha256
          cat manifest.sha256
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/liblattice-*,dist/manifest.sha256
          generate_release_notes: true
