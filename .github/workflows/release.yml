name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: liblattice.so
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: liblattice.so
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: liblattice.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: liblattice.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: lattice.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build C ABI library
        run: cargo build --release --target ${{ matrix.target }} -p lattice-cabi
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liblattice-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: liblattice-*
          merge-multiple: true
      - name: Generate SHA-256 manifest
        run: |
          cd dist
          sha256sum * > manifest.sha256
          cat manifest.sha256
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
