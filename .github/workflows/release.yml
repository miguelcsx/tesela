name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  python-wheels:
    name: Python Wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel
        run: |
          cd sdk/python
          python -m pip install --upgrade pip build maturin
          python -m pip install --no-cache-dir -e .
          python -m build --wheel --outdir dist
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: sdk/python/dist/*.whl

  release:
    needs: python-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheels-*
          merge-multiple: true
      - name: Generate SHA-256 manifest
        run: |
          cd wheels
          sha256sum * > manifest.sha256
          cat manifest.sha256
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wheels/*
          generate_release_notes: true
