[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "tesela"
version = "0.1.0"
description = "Declarative ontology runtime with native Rust bindings"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Miguel Cárdenas" }]

[tool.maturin]
module-name = "tesela._native"
python-source = "."
manifest-path = "Cargo.toml"
