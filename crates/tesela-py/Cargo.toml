[package]
name = "tesela-py"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "PyO3 native Python bindings for the Tesela runtime."

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { workspace = true, features = ["extension-module"] }
serde = { workspace = true }
serde_json = { workspace = true }
tesela-core = { workspace = true }
tesela-ir = { workspace = true }
tesela-compiler = { workspace = true }
tesela-runtime = { workspace = true }
tesela-memory = { workspace = true }
