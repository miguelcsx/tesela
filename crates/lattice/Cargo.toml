[package]
name = "lattice"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Ontology-driven application runtime — define object types, links, policies, actions, and agents in a declarative spec; query, mutate, and serve them over REST, GraphQL, or MCP."

[dependencies]
lattice-core = { workspace = true }
lattice-ir = { workspace = true }
lattice-graph = { workspace = true }
lattice-compiler = { workspace = true }
lattice-runtime = { workspace = true }
lattice-memory = { workspace = true }
lattice-server = { workspace = true }
lattice-graphql = { workspace = true }
lattice-mcp = { workspace = true }
lattice-sdk = { workspace = true, features = ["native-runtime"] }
lattice-macros = { workspace = true, optional = true }

[features]
macros = ["dep:lattice-macros"]

[dev-dependencies]
chrono = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
