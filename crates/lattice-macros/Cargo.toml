[package]
name = "lattice-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Procedural macros for declarative Lattice ontology definitions."

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
darling = "0.20"

[dev-dependencies]
lattice-core = { workspace = true }
lattice-ir = { workspace = true }
