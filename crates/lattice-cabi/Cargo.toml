[package]
name = "lattice-cabi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "C ABI shared library exposing the Lattice runtime for FFI consumers (Python, etc.)."

[lib]
# Compile as a C-compatible shared library.
crate-type = ["cdylib", "staticlib"]

[dependencies]
lattice-core = { workspace = true }
lattice-ir = { workspace = true }
lattice-compiler = { workspace = true }
lattice-runtime = { workspace = true }
lattice-memory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libc = "0.2"
