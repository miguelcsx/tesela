# Lattice — golangci-lint v1.60+ configuration.
#
# Goals:
#  - Enforce layered architecture via depguard (no cross-layer leaks).
#  - Catch common bug classes (errcheck, staticcheck, gosec, ineffassign).
#  - Keep style consistent (gofumpt, gci with project-aware import order).
#  - Forbid common foot-guns: ignored errors, naked returns in long funcs, init() side effects.

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true

linters:
  disable-all: true
  enable:
    - bodyclose
    - depguard
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - gci
    - gocritic
    - godot
    - gofumpt
    - goimports
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused

linters-settings:
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/miguelcsx/lattice)
    skip-generated: true
    custom-order: true

  gofumpt:
    extra-rules: true

  govet:
    enable-all: true
    disable:
      - fieldalignment

  errcheck:
    check-blank: true
    check-type-assertions: true

  errorlint:
    errorf: true
    asserts: true
    comparison: true

  exhaustive:
    default-signifies-exhaustive: true

  nakedret:
    max-func-lines: 15

  revive:
    severity: warning
    rules:
      - name: var-naming
      - name: exported
        arguments:
          - "checkPrivateReceivers"
          - "disableStutteringCheck"
      - name: package-comments
      - name: indent-error-flow
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id
      - name: confusing-naming
      - name: confusing-results
      - name: bool-literal-in-expr
      - name: range-val-in-closure

  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
      - opinionated
    disabled-checks:
      - whyNoLint
      - hugeParam

  depguard:
    rules:
      core-is-pure:
        files:
          - '**/internal/core/**'
        deny:
          - pkg: github.com/miguelcsx/lattice
            desc: 'internal/core must not import any other lattice package'
      no-adapter-impl-leak:
        files:
          - '**/internal/**'
          - '!**/internal/api/**'
          - '!**/internal/worker/**'
        deny:
          - pkg: github.com/miguelcsx/lattice/pkg/adapters
            desc: 'concrete adapter implementations may only be wired in cmd/* (composition root) or internal/api/internal/worker'
      no-import-api-or-worker:
        files:
          - '**/internal/**'
          - '!**/internal/api/**'
          - '!**/internal/worker/**'
        deny:
          - pkg: github.com/miguelcsx/lattice/internal/api
            desc: 'no inner package may depend on internal/api'
          - pkg: github.com/miguelcsx/lattice/internal/worker
            desc: 'no inner package may depend on internal/worker'

issues:
  exclude-dirs:
    - vendor
    - bin
    - dist
    - docs
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - gosec
        - errcheck
        - unparam
    - path: '(.+)_test\.go'
      text: 'fieldalignment'
      linters:
        - govet
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
